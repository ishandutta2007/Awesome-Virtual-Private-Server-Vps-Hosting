<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Animated / Dynamic Grid lines in background -->
  <g opacity="0.15">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="200" y1="0" x2="200" y2="320" stroke="#818cf8" stroke-width="1" />
    <line x1="400" y1="0" x2="400" y2="320" stroke="#818cf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="320" stroke="#818cf8" stroke-width="1" />
    <line x1="800" y1="0" x2="800" y2="320" stroke="#818cf8" stroke-width="1" />
    <line x1="1000" y1="0" x2="1000" y2="320" stroke="#818cf8" stroke-width="1" />
  </g>

  <!-- Dynamic Animated Floating Server Pulse Waves (Background Layer) -->
  <g opacity="0.25">
    <circle cx="1020" cy="160" r="90" fill="none" stroke="#38bdf8" stroke-width="2">
      <animate attributeName="r" values="60;130;60" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="160" r="130" fill="none" stroke="#818cf8" stroke-width="1.5">
      <animate attributeName="r" values="90;160;90" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.0;0.6" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Network Nodes (Right Side Background) -->
  <g opacity="0.3">
    <polygon points="960,80 1080,120 1020,240 900,200" fill="url(#accentGrad)" />
    <circle cx="960" cy="80" r="6" fill="#38bdf8" />
    <circle cx="1080" cy="120" r="6" fill="#818cf8" />
    <circle cx="1020" cy="240" r="6" fill="#c084fc" />
    <circle cx="900" cy="200" r="6" fill="#38bdf8" />
    <line x1="960" y1="80" x2="1080" y2="120" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="1080" y1="120" x2="1020" y2="240" stroke="#818cf8" stroke-width="1.5" />
    <line x1="1020" y1="240" x2="900" y2="200" stroke="#c084fc" stroke-width="1.5" />
    <line x1="900" y1="200" x2="960" y2="80" stroke="#38bdf8" stroke-width="1.5" />
  </g>

  <!-- Server Rack Graphic (Right Foreground Accent) -->
  <g transform="translate(970, 90)">
    <rect x="0" y="0" width="100" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Server Slot 1 -->
    <rect x="10" y="15" width="80" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="22" cy="27" r="3" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="32" cy="27" r="3" fill="#38bdf8" />
    <rect x="45" y="25" width="35" height="4" rx="2" fill="#334155" />

    <!-- Server Slot 2 -->
    <rect x="10" y="47" width="80" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="22" cy="59" r="3" fill="#22c55e" />
    <circle cx="32" cy="59" r="3" fill="#eab308">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <rect x="45" y="57" width="35" height="4" rx="2" fill="#334155" />

    <!-- Server Slot 3 -->
    <rect x="10" y="79" width="80" height="24" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="22" cy="91" r="3" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="32" cy="91" r="3" fill="#38bdf8" />
    <rect x="45" y="89" width="35" height="4" rx="2" fill="#334155" />
  </g>

  <!-- Foreground Title and Subtitle (Crisp & High Contrast Layer) -->
  <g transform="translate(80, 0)">
    <!-- Badge Pill Above Title -->
    <rect x="0" y="55" width="230" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="115" y="75" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="140" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">Awesome VPS Hosting</text>

    <!-- Subtitle -->
    <text x="0" y="182" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" opacity="0.95">Curated Cloud Compute &amp; Self-Hosted Virtualization Platforms</text>

    <!-- Tagline & Highlights -->
    <text x="0" y="222" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">⚡ Commercial VPS Providers • 🖥️ Proxmox &amp; OpenStack • 🚀 Self-Hosted PaaS (Coolify/Dokploy)</text>

    <!-- Footer Stats / Version Pill -->
    <rect x="0" y="250" width="460" height="28" rx="6" fill="#0f172a" opacity="0.8" stroke="#334155" stroke-width="1" />
    <text x="15" y="269" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500">
      <tspan fill="#38bdf8">●</tspan> Enterprise IaaS &nbsp;|&nbsp; <tspan fill="#818cf8">●</tspan> Open-Source Hypervisors &nbsp;|&nbsp; <tspan fill="#c084fc">●</tspan> IaC &amp; Control Panels
    </text>
  </g>
</svg>
